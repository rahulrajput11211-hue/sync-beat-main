name: syncbeat
description: Synchronized music party app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  file_picker: ^8.1.4
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
